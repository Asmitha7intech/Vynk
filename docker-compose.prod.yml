version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 with pgvector extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vynk-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vynk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vynk_prod_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vynk_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vynk_admin} -d ${POSTGRES_DB:-vynk_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. CACHE & REAL-TIME PUB/SUB: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vynk-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-vynk_redis_password_change_me}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vynk_redis_password_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. BACKEND API: Fastify 5 + WebSockets + Argon2id
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vynk-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vynk_admin}:${POSTGRES_PASSWORD:-vynk_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-vynk_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-vynk_redis_password_change_me}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-no-reply@vynk.app}
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 4. FRONTEND WEB: React 19 + Nginx SPA
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vynk-prod-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  uploads_data:
